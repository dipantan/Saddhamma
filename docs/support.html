<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Support Saddhamma - Ko-fi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #B58105; 
            --bg: #FAFAFA; 
            --text: #2D2D2D; 
            --text-secondary: #666666; 
            --card: #FFFFFF; 
            --border: #EEEEEE; 
        }
        @media (prefers-color-scheme: dark) { 
            :root { 
                --bg: #121212; 
                --text: #E0E0E0; 
                --text-secondary: #AAAAAA; 
                --card: #1E1E1E; 
                --border: #333333; 
            } 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            line-height: 1.6; 
            padding: 12px 6px; 
        }
        .container { 
            max-width: 550px; 
            margin: 0 auto; 
            background: var(--card); 
            padding: 20px 10px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            text-align: center; 
        }
        @media (min-width: 600px) {
            body { padding: 40px 20px; }
            .container { padding: 32px 24px; border-radius: 20px; }
        }
        h1 { font-family: 'Noto Serif', serif; color: var(--primary); margin-bottom: 8px; font-size: 26px; }
        p { margin-bottom: 20px; color: var(--text-secondary); font-size: 14px; padding: 0 8px; }
        .back-link { display: inline-block; margin-bottom: 16px; color: var(--primary); text-decoration: none; font-weight: 600; text-align: left; width: 100%; font-size: 14px; padding-left: 4px; }
        .widget-wrapper { border-radius: 12px; overflow: hidden; margin-top: 10px; width: 100%; }
        iframe { border: none; width: 100%; height: 720px; background: transparent; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <h1>Support Saddhamma</h1>
        <p>If you find this Dhamma app valuable for your study and practice, consider supporting its development and maintenance.</p>
        
        <div class="widget-wrapper">
            <iframe id='kofiframe' src='https://ko-fi.com/dipantan/?hidefeed=true&widget=true&embed=true&preview=true' title='dipantan'></iframe>
        </div>
    </div>
</body>
</html>
